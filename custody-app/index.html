<!DOCTYPE html>
<html>
<head>
  <title>Custody App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../shared/nav.js"></script>
</head>
<body>
  <app-nav active="custody"></app-nav>
  <div class="tabs">
    <button class="tab-link" onclick="openTab('option1')">Option 1</button>
    <button class="tab-link" onclick="openTab('option2')">Option 2</button>
  </div>

  <div id="option1" class="tab-content">
    <iframe src="./option1.html" class="w-full h-full"></iframe>
  </div>

  <div id="option2" class="tab-content" style="display:none">
    <iframe src="./option2.html" class="w-full h-full"></iframe>
  </div>

  <script>
    function openTab(tabName) {
      var i, tabcontent, tablinks;
      tabcontent = document.getElementsByClassName("tab-content");
      for (i = 0; i < tabcontent.length; i++) {
        tabcontent[i].style.display = "none";
      }
      document.getElementById(tabName).style.display = "block";
    }
    openTab('option1');
  </script>
</body>
</html>
