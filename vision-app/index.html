<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Vision Classifier</title>
  <link rel="stylesheet" href="style.css">
  <script src="../shared/nav.js"></script>
  <script src="../shared/qr.js"></script>
</head>
<body>
  <app-nav active="vision"></app-nav>
  <theme-toggle></theme-toggle>
  <div class="app-container">
    <header>
      <h1>🤖 AI Vision Classifier</h1>
      <p>Recognize objects in real-time using your custom model.</p>
      <button onclick="document.getElementById('qr-modal').style.display='flex'">QR Code</button>
    </header>
    <vision-classifier></vision-classifier>
  </div>
  
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
  <script type="module" src="main.js"></script>
  <div id="qr-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center;">
    <div style="background: white; padding: 2rem; border-radius: 1rem;">
      <qr-code text="https://vibe-2026-may-14-b2e.pages.dev/vision-app/" size="256"></qr-code>
      <button onclick="document.getElementById('qr-modal').style.display='none'" style="display: block; margin-top: 1rem;">Close</button>
    </div>
  </div>
</body>
</html>
